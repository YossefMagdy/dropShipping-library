<div class="filter-container d-flex flex-wrap justify-content-center align-items-center">
    
<div  class="d-flex align-items-center m-2">
    <label for="site">الموقع</label>
    <ng-select id="site" class="my-select my-select-md" placeholder="الموقع">
        @for (car of cars; track car.id) {
            <ng-option [value]="car.id">{{car.name}}</ng-option>
        }
    </ng-select>
</div>

<div class="d-flex align-items-center m-2">
    <label for="filter">التصنيف</label>
    <ng-select id="filter" class="my-select my-select-md" placeholder="التصنيف">
        @for (car of cars; track car.id) {
            <ng-option [value]="car.id">{{car.name}}</ng-option>
        }
    </ng-select>
</div>

    <button class="btn btn-primary">استرداد البيانات</button>

</div>
