<div class="filter-container d-flex flex-wrap justify-content-center align-items-center">
    
<div  class="d-flex align-items-center m-2">
    <label for="site" class="">الموقع</label>
    <ng-select id="site" class="my-select my-select-md" placeholder="الموقع">
        
    </ng-select>
</div>

<div class="d-flex align-items-center m-2">
    <label for="filter">التصنيف</label>
    <div class="category-list">
        <ng-select (click)="this.openCategory=!this.openCategory" id="site" class="my-select my-select-md CategoryBox" placeholder="الموقع">
           
        </ng-select>
       
            <ng-template [ngIf]="openCategory">
                <app-recursion-list *ngIf="categories.length" [categories]="categories" (chosenCategory)="onCategoryChose($event)"></app-recursion-list>
            </ng-template>
        
    </div>
</div>

    <button class="btn btn-primary d-block" style="margin-top: 5px;">استرداد البيانات</button>

</div>
